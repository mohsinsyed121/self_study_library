# Render Blueprint: creates a web service + PostgreSQL database from this file.
databases:
  - name: library-db
    plan: free
    databaseName: library
    user: library

services:
  - type: web
    name: self-study-library
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
