{% extends 'base.html' %}
{% block title %}Log out - {{ site.library_name }}{% endblock %}
{% block content %}
<div class="card auth-card text-center">
  <div class="card-body p-4">
    <h1 class="h4">Log out?</h1>
    <p class="text-muted">You will need to log in again to see your account.</p>
    {# Logging out uses POST so a link on another website cannot log you out. #}
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">Yes, log me out</button>
      <a href="{% url 'after_login' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
