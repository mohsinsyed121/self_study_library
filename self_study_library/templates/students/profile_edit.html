{% extends 'layouts/student_base.html' %}
{% block title %}Edit profile - {{ site.library_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Edit profile</h1></div>
<div class="card form-card"><div class="card-body">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{% url 'student_profile' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
