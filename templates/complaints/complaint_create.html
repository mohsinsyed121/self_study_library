{% extends 'layouts/student_base.html' %}
{% block title %}New complaint - {{ site.library_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Submit a complaint</h1></div>
<div class="card form-card"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}{% include 'partials/form_fields.html' %}
    <button class="btn btn-primary" type="submit">Submit complaint</button>
    <a href="{% url 'complaint_list' %}" class="btn btn-outline-secondary">Cancel</a></form>
</div></div>
{% endblock %}
